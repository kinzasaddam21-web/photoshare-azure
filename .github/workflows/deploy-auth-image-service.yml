name: Deploy auth-image-service to Azure

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-image-service/**'
      - '.github/workflows/deploy-auth-image-service.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: auth-image-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-image-service
          file: ./services/auth-image-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Done
        run: |
          echo "✅ Image pushed to ACR"
          echo "App Service will auto-pull and deploy via continuous deployment"
          echo "Site: https://${{ secrets.APP_AUTH_NAME }}.azurewebsites.net"
